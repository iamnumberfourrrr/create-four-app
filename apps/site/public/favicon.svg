<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="create-four-app">
  <style>
    :root {
      --paper: oklch(97% 0.005 130);
      --ink: oklch(25% 0.01 130);
      --rule: oklch(82% 0.008 130);
      --accent: oklch(85% 0.22 130);
    }

    @media (prefers-color-scheme: dark) {
