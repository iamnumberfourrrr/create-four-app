        --paper: oklch(15% 0.005 130);
        --ink: oklch(92% 0.005 130);
        --rule: oklch(32% 0.008 130);
      }
    }
  </style>
  <rect width="64" height="64" fill="var(--paper)" />
  <rect x="6" y="6" width="52" height="52" fill="none" stroke="var(--rule)" stroke-width="2" />
  <path
    d="M42 12 18 40h30M42 12v40"
    fill="none"
    stroke="var(--ink)"
    stroke-width="7"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <rect x="14" y="55" width="36" height="4" fill="var(--accent)" />
