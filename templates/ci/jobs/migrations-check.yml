jobs:
  migrations-check:
    name: Migrations check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for uncommitted migrations
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "ERROR: Uncommitted migration files detected."
            echo "Run 'pnpm db:generate' locally and commit the resulting files."
            git diff --name-only packages/db/drizzle
            exit 1
          fi
          echo "Migration check passed — no drift detected."
