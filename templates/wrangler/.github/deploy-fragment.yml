# deploy-cf job fragment — consumed by phase-07 CI installer.
#
# This fragment is merged into the generated ci.yml when wrangler=true.
# The job is gated on workflow_dispatch so it is inert until manually triggered
# or wired to a push/release trigger by the user.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   — from https://dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID  — from Cloudflare dashboard right sidebar

jobs:
  deploy-cf:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    # Only run on manual dispatch (safe default — wire to push/release as needed)
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
